<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별을 입는 아뜰리에</title>
<meta name="description" content="종이에 그린 옷을 손님이 입고 사진 편지를 보내 줘요. 아이패드 게임.">
<meta property="og:title" content="별을 입는 아뜰리에">
<meta property="og:description" content="종이에 그린 옷을 손님이 입고 사진 편지를 보내 줘요 · 아이패드 게임">
<meta property="og:image" content="https://hyee0ne.github.io/atelier/og.jpg">
<meta property="og:url" content="https://hyee0ne.github.io/atelier/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#EEE7F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
<script>
  // v4 (2026-10-21): v3 디자인 그대로, 요소만 줄인다 — 사용자 "요소가 너무 많다". 폰에는 버튼 하나 (알림 받기도 뺐다, 10/21)
  (function () {
    var q = new URLSearchParams(location.search);
    var CT = /^[A-Za-z0-9_.-]{1,40}$/.test(q.get("ct") || "") ? q.get("ct") : "x_post";
    var VIA = /^[a-z]{1,8}$/.test(q.get("via") || "") ? q.get("via") : "";
    window.__ct = CT;
    window.__store = "https://apps.apple.com/kr/app/apple-store/id6813819414?pt=129108053&ct=" + encodeURIComponent(CT) + "&mt=8";
    window.__self = location.origin + location.pathname;
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var ipad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var ia = /Instagram/.test(ua) ? "instagram" : /FBAN|FBAV|FB_IAB/.test(ua) ? "facebook" : /KAKAOTALK/.test(ua) ? "kakao"
      : /NAVER/.test(ua) ? "naver" : /Line\//.test(ua) ? "line" : /Twitter/.test(ua) ? "x" : /CriOS/.test(ua) ? "chrome"
      : ios && !/Safari\//.test(ua) ? "webview" : /Safari\//.test(ua) ? "safari" : "other";
    window.__dev = ipad ? "ipad" : /iPhone|iPod/.test(ua) ? "iphone" : /Android/.test(ua) ? "android" : "desktop";
    window.__beacon = function (k, extra) {
      try { fetch("https://atelier-go-zudqsaysna-du.a.run.app/e?k=" + k + "&ct=" + encodeURIComponent(CT) + "&via=" + VIA + "&pg=gh&d=" + window.__dev + "&ia=" + ia + (extra || ""), { keepalive: true, mode: "no-cors" }); } catch (e) {}
    };
    var cls = [window.__dev, "ia-" + ia, navigator.share ? "can-share" : "no-share"];
    if (ia !== "safari" && ia !== "chrome" && ia !== "other") cls.push("inapp");
    document.documentElement.className = cls.join(" ");
    if (ipad) {
      window.__beacon("ipad");
      setTimeout(function () { location.replace(window.__store); }, 120);
      setTimeout(function () {
        if (document.visibilityState === "visible") { document.documentElement.classList.add("stuck"); window.__beacon("stuck"); }
      }, 2200);
    }
  })();
</script>
<style>
  :root { --ink: #3B3171; --soft: #5E5672; --accent: #7A4FB3; --lav: #EEE7F7; --cream: #FBF7EF; --line: #D9CCEC; --gold: #C9A45C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--lav); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-text-size-adjust: 100%; }

  /* 머리: 공방 로비(낮) 위에 로고 */
  /* 로고가 잘 보이게 (10/21 사용자: 직접 검색할 수도 있다) — 불투명 로고를 크게, 배경은 옅게 눌러 둔다 */
  .head { position: relative; height: 164px; background: url(head.jpg) center 30% / cover; }
  .head::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .82) 0%, rgba(250, 247, 253, .88) 55%, var(--lav) 100%); }   /* 로고 뒤를 더 하얗게 (10/21) */
  .head .logo { position: absolute; z-index: 1; left: 50%; top: 16px; transform: translateX(-50%); height: 92px; filter: drop-shadow(0 3px 8px rgba(59, 49, 113, .18)); }
  main { position: relative; max-width: 440px; margin: -40px auto 0; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 18px; }   /* 요소 사이를 넉넉히 (10/21) */

  /* 무대: 그려요 → 입어요 → 편지가 와요 (9초에 한 바퀴) */
  .stage { position: relative; width: 100%; aspect-ratio: 1 / .88; border-radius: 22px; overflow: hidden; background: var(--cream);
           box-shadow: 0 0 0 1.5px rgba(201, 164, 92, .55), 0 0 0 7px rgba(255, 255, 255, .7), 0 14px 34px rgba(59, 49, 113, .22); }
  .slide { position: absolute; inset: 0; opacity: 0; animation: show 9s infinite; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide:nth-child(1) { animation-delay: 0s; }
  .slide:nth-child(2) { animation-delay: 3s; }
  .slide:nth-child(3) { animation-delay: 6s; }
  @keyframes show { 0% { opacity: 0; } 5% { opacity: 1; } 33% { opacity: 1; } 38% { opacity: 0; } 100% { opacity: 0; } }
  .cap { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px;
         background: rgba(255, 255, 255, .88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 15px; font-weight: 700; color: var(--ink); }
  .cap i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; display: grid; place-items: center; }
  .dots { position: absolute; right: 14px; bottom: 20px; display: flex; gap: 6px; }
  .dots b { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .65); animation: dot 9s infinite; }
  .dots b:nth-child(2) { animation-delay: 3s; }
  .dots b:nth-child(3) { animation-delay: 6s; }
  @keyframes dot { 0%, 37%, 100% { background: rgba(255, 255, 255, .65); } 5%, 33% { background: #fff; transform: scale(1.25); } }
  .spark { position: absolute; color: var(--gold); font-size: 14px; pointer-events: none; animation: tw 2.8s ease-in-out infinite; text-shadow: 0 0 8px rgba(255, 240, 200, .9); }
  @keyframes tw { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

  h1 { font-family: Hahmlet, serif; font-size: 23px; line-height: 1.35; margin: 10px 0 0; text-align: center; letter-spacing: -.3px; }
  .meet { margin: -8px 0 8px; text-align: center; font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: -.2px; }
  .lead { font-size: 15px; line-height: 1.55; color: var(--soft); margin: -6px 0 2px; text-align: center; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 999px; padding: 17px; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .primary { color: #fff; background: linear-gradient(180deg, #9468D6 0%, #7A4FB3 55%, #6A42A2 100%);
             box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 8px 18px rgba(106, 66, 162, .35), 0 0 0 4px rgba(122, 79, 179, .12); }
  .primary:active { transform: translateY(1px); }
  .ghost { background: rgba(255, 255, 255, .8); color: var(--ink); border: 1px solid var(--line); padding: 13px; font-size: 15px; font-weight: 600; }
  .note { font-size: 13px; line-height: 1.5; color: var(--soft); margin: -6px 0 0; text-align: center; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .tip { display: none; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.5; text-align: center; }
  .qr { display: none; background: #fff; border-radius: 18px; padding: 18px; flex-direction: column; align-items: center; gap: 8px; border: 1px solid var(--line); }
  .qr svg { width: 156px; height: 156px; }
  .qr p { margin: 0; font-size: 14px; color: var(--soft); }
  .qr.on { display: flex; }
  .handoff { display: none; font-size: 13px; line-height: 1.5; color: var(--soft); text-align: center; margin: 0; }

  /* 지금 아이패드가 없어요: 앱의 편지지처럼 */
  .letter { margin-top: 12px; background: var(--cream); border-radius: 18px; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: inset 0 0 0 1px rgba(201, 164, 92, .6), inset 0 0 0 5px var(--cream), inset 0 0 0 6px rgba(201, 164, 92, .35), 0 8px 20px rgba(59, 49, 113, .1); }
  .letter h2 { font-family: Hahmlet, serif; font-size: 17px; margin: 0 0 4px; text-align: center; }
  .search { font-size: 13px; color: var(--soft); text-align: center; margin: 4px 0 0; line-height: 1.5; }
  .search b { color: var(--ink); }
  .foot { text-align: center; font-size: 12px; color: var(--soft); opacity: .75; padding: 4px 16px 24px; }   /* 맨 아래 저작권 (10/21) */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
  .toast.on { opacity: 1; }

  html.desktop #share { display: none; }

  /* 기기·브라우저별로 보이는 것 */
  .going { display: none; }
  html.ipad .phone { display: none; }
  html.ipad .going { display: flex; }
  .stuck-only { display: none; }
  html.stuck .stuck-only { display: block; }
  html.stuck .going-msg { display: none; }
  html.inapp.no-share .tip, html.ia-instagram .tip, html.ia-facebook .tip { display: block; }
  html.desktop #qr { display: flex; }
  @media (prefers-reduced-motion: reduce) { .slide, .dots b, .spark { animation: none; } .slide:nth-child(2) { opacity: 1; } }
</style>
</head>
<body>
<div class="head"><img class="logo" src="logo_v4.png" alt="별을 입는 아뜰리에"></div>

<main class="going">
  <p class="lead going-msg">앱스토어로 가는 중이에요</p>
  <p class="lead stuck-only">앱스토어가 안 열리면 오른쪽 위 ⋯ 에서<br>‘외부 브라우저로 열기’를 눌러 주세요</p>
  <a class="btn primary" id="storeLink" href="#">앱스토어 열기</a>
</main>

<main class="phone">
  <p class="tip">오른쪽 위 ⋯ 에서 ‘외부 브라우저로 열기’를 누르면<br>아이패드로 보내기가 쉬워요</p>
  <div class="stage">
    <div class="slide"><img src="t1.jpg" alt="물감과 꽃 옆, 종이에 그린 세드의 검은 후드 코트 도안"><span class="cap"><i>1</i>종이에 그려요</span></div>
    <div class="slide"><img src="t2.jpg" alt="그 코트를 입고 무대에 선 세드"><span class="cap"><i>2</i>손님이 입어요</span></div>
    <div class="slide"><img src="t3.jpg" alt="코트를 입고 양산을 든 채 빵집 문을 여는 세드의 사진 편지"><span class="cap"><i>3</i>사진 편지가 와요</span></div>
    <div class="dots"><b></b><b></b><b></b></div>
    <span class="spark" style="left:14px;top:14px">✦</span>
    <span class="spark" style="right:22px;top:40px;animation-delay:1.1s;font-size:11px">✦</span>
    <span class="spark" style="right:44px;top:12px;animation-delay:2s;font-size:9px">✦</span>
  </div>
  <h1>별을 입는 아뜰리에는<br>옷을 그려서 입히는 게임입니다.</h1>
  <p class="meet">아이패드에서 만나요!</p>
  <button class="btn primary" id="share">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
    내 아이패드로 보내기
  </button>
  <div class="qr" id="qr">
    <div id="qrBox"></div>
    <p>아이패드 카메라로 찍으면 바로 열려요</p>
  </div>
</main>
<footer class="foot">© 2026 라이스쿠키</footer>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  var SHARE_URL = window.__self + "?ct=" + encodeURIComponent(window.__ct) + "&via=share";
  document.getElementById("storeLink").href = window.__store;
  // 컴퓨터에서만 QR 을 그린다 (아이패드 카메라로 찍는다)
  if (window.__dev === "desktop" && window.qrcode) {
    var qr = qrcode(0, "M"); qr.addData(window.__self + "?ct=" + encodeURIComponent(window.__ct) + "&via=qr"); qr.make();
    document.getElementById("qrBox").innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 })
      .replace(/fill="black"|fill="#000000"/g, 'fill="#3B3171"');
  }
  window.__beacon("view");
  var beacon = window.__beacon;
  if (window.__dev !== "ipad") beacon("env", "&sh=" + (navigator.share ? 1 : 0));
  function toast(text) {
    var t = document.getElementById("toast"); t.textContent = text; t.classList.add("on");
    setTimeout(function () { t.classList.remove("on"); }, 2200);
  }
  function copy() {
    beacon("copy");
    var done = function () { toast("복사했어요. 아이패드 사파리에 붙여 넣으세요"); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(SHARE_URL).then(done, function () { prompt("이 링크를 복사하세요", SHARE_URL); }); }
    else { prompt("이 링크를 복사하세요", SHARE_URL); }
  }
  document.getElementById("share").onclick = function () {
    beacon("share");
    if (navigator.share) {
      navigator.share({ title: "별을 입는 아뜰리에", url: SHARE_URL }).then(function () { beacon("shared"); }, function () {});
    } else { copy(); }
  };
</script>
</body>
</html>
